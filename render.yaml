services:
  - type: web
    name: salary-backend
    env: python
    root: backend/Salary-predict-service
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1

  - type: static_site
    name: salary-frontend
    env: static
    root: frontend/Salary
    branch: main
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://salary-backend.onrender.com
